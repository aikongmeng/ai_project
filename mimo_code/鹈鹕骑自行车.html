<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pelican Cyclist — a looping SVG animation</title>
<style>
  :root{
    --paper:#F1E6D3;
    --ink:#20303A;
    --muted:#8B7355;
    --coral:#D9482F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 18% 8%, rgba(255,255,255,.6), transparent 58%);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(18px,4vw,56px);
  }
  .stage{width:min(1180px,100%);}
  .kicker{
    margin:0 0 .6rem;
    font-size:.72rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:.85rem;
  }
  .kicker::after{content:"";flex:1;height:1px;background:currentColor;opacity:.32;}
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(1.9rem,4.4vw,3.3rem);
    line-height:1.02;
    letter-spacing:-.015em;
    margin:0 0 1.25rem;
  }
  h1 em{font-style:normal;color:var(--coral);}
  .poster{
    margin:0;
    background:#F2A25C;
    box-shadow:0 34px 74px -32px rgba(32,48,58,.5), 0 2px 0 rgba(255,255,255,.55);
  }
  svg.art{display:block;width:100%;height:auto;}
  figcaption{
    margin-top:1.15rem;
    display:flex;
    flex-wrap:wrap;
    gap:.5rem 1.6rem;
    justify-content:space-between;
    font-size:.82rem;
    color:var(--muted);
    letter-spacing:.02em;
  }
  figcaption b{color:var(--ink);font-weight:700;}

  @keyframes drift{from{transform:translateX(0);}to{transform:translateX(-1200px);}}
  @keyframes bob{0%,100%{transform:translateY(2px);}50%{transform:translateY(-5px);}}

  .clouds{animation:drift 64s linear infinite;}
  .hills-far{animation:drift 26s linear infinite;}
  .hills-near{animation:drift 13s linear infinite;}
  .dashes{animation:drift 1.96s linear infinite;}
  .tufts{animation:drift 1.35s linear infinite;}
  .bob{animation:bob .41s ease-in-out infinite;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
  }
</style>
</head>
<body>

<main class="stage">
  <p class="kicker">Vector frame 01 &middot; coastal road</p>
  <h1>The Pelican <em>Cyclist</em></h1>

  <figure class="poster">
    <svg class="art" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="artTitle artDesc" preserveAspectRatio="xMidYMid meet">
      <title id="artTitle">A pelican riding a bicycle into the sunset</title>
      <desc id="artDesc">Flat vector illustration, animated in a loop: a pelican with a long orange bill and a red scarf pedals a golden bicycle along a coast road. Hills, clouds, road markings and grass scroll past beneath a coral sun.</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FBD9AB"/>
          <stop offset="0.55" stop-color="#F7BE84"/>
          <stop offset="1" stop-color="#F2A25C"/>
        </linearGradient>

        <g id="cloud" fill="#FFF1DC" opacity=".82">
          <ellipse cx="60" cy="0" rx="62" ry="26"/>
          <ellipse cx="12" cy="8" rx="36" ry="19"/>
          <ellipse cx="108" cy="10" rx="42" ry="21"/>
          <rect x="-22" y="0" width="172" height="27" rx="13"/>
        </g>

        <path id="hillFar" d="M 0 470 C 60 430, 120 420, 190 452 C 250 480, 300 430, 380 424 C 450 419, 490 452, 560 460 C 640 470, 690 418, 780 420 C 860 422, 900 458, 980 462 C 1060 466, 1130 430, 1200 470 L 1200 580 L 0 580 Z"/>
        <path id="hillNear" d="M 0 528 C 90 486, 170 470, 250 500 C 330 530, 390 470, 470 476 C 560 483, 610 520, 700 522 C 790 524, 840 476, 930 480 C 1030 485, 1110 516, 1200 528 L 1200 580 L 0 580 Z"/>

        <g id="dashSet" fill="#F7E6C8" opacity=".8">
          <rect x="60" y="652" width="132" height="16" rx="8"/>
          <rect x="300" y="652" width="132" height="16" rx="8"/>
          <rect x="540" y="652" width="132" height="16" rx="8"/>
          <rect x="780" y="652" width="132" height="16" rx="8"/>
          <rect x="1020" y="652" width="132" height="16" rx="8"/>
        </g>

        <path id="tuft" d="M -44 0 C -46 -26, -18 -42, 2 -28 C 14 -48, 48 -42, 50 -16 C 62 -20, 68 -8, 62 0 Z"/>

        <rect id="ray" x="970" y="12" width="10" height="42" rx="5" fill="#F7C86B" opacity=".55"/>

        <path id="frameShape" fill="none" stroke-linecap="round" stroke-linejoin="round"
              d="M 392 548 L 588 562 L 518 414 Z M 518 414 L 772 412 L 588 562 M 772 412 Q 802 476 822 548 M 772 412 L 786 356"/>
        <path id="barShape" fill="none" stroke-linecap="round"
              d="M 706 342 C 738 316, 812 320, 850 352"/>

        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
      </defs>

      <!-- ================= SKY ================= -->
      <rect x="0" y="0" width="1200" height="800" fill="url(#sky)"/>

      <!-- sun -->
      <circle cx="975" cy="175" r="168" fill="#F7C86B" opacity=".33"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 975 175" to="360 975 175" dur="70s" repeatCount="indefinite"/>
        <use href="#ray"/>
        <use href="#ray" transform="rotate(45 975 175)"/>
        <use href="#ray" transform="rotate(90 975 175)"/>
        <use href="#ray" transform="rotate(135 975 175)"/>
        <use href="#ray" transform="rotate(180 975 175)"/>
        <use href="#ray" transform="rotate(225 975 175)"/>
        <use href="#ray" transform="rotate(270 975 175)"/>
        <use href="#ray" transform="rotate(315 975 175)"/>
      </g>
      <circle cx="975" cy="175" r="115" fill="#DA4F2B"/>

      <!-- birds -->
      <g fill="none" stroke="#20303A" stroke-width="4" stroke-linecap="round" opacity=".5">
        <path d="M 258 168 q 15 -13 30 0 q 15 -13 30 0"/>
        <path d="M 336 128 q 11 -9 22 0 q 11 -9 22 0"/>
      </g>

      <!-- clouds -->
      <g class="clouds">
        <use href="#cloud" transform="translate(150 190) scale(1.15)"/>
        <use href="#cloud" transform="translate(430 108) scale(.82)"/>
        <use href="#cloud" transform="translate(1118 296) scale(1.1)"/>
        <use href="#cloud" transform="translate(1350 190) scale(1.15)"/>
        <use href="#cloud" transform="translate(1630 108) scale(.82)"/>
        <use href="#cloud" transform="translate(2318 296) scale(1.1)"/>
      </g>

      <!-- ================= LAND ================= -->
      <g class="hills-far" fill="#57A996">
        <use href="#hillFar"/>
        <use href="#hillFar" x="1200"/>
      </g>
      <g class="hills-near" fill="#2E8574">
        <use href="#hillNear"/>
        <use href="#hillNear" x="1200"/>
      </g>

      <!-- road -->
      <rect x="0" y="572" width="1200" height="228" fill="#E9C183"/>
      <rect x="0" y="690" width="1200" height="110" fill="#DCAE6C"/>
      <g class="dashes">
        <use href="#dashSet"/>
        <use href="#dashSet" x="1200"/>
      </g>

      <!-- contact shadows -->
      <ellipse cx="600" cy="640" rx="252" ry="20" fill="#C08F4E" opacity=".38"/>
      <ellipse cx="392" cy="632" rx="46" ry="10" fill="#B8843F" opacity=".5"/>
      <ellipse cx="822" cy="632" rx="46" ry="10" fill="#B8843F" opacity=".5"/>

      <!-- ================= FAR LEG (behind frame) ================= -->
      <g class="bob">
        <path fill="none" stroke="#20303A" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" d="M 566 430 L 596 508 L 588 602">
          <animate attributeName="d" dur="0.82s" repeatCount="indefinite"
            values="M 566 430 L 596 508 L 588 602;
                    M 566 430 L 616 497 L 548 562;
                    M 566 430 L 648 450 L 588 522;
                    M 566 430 L 640 469 L 628 562;
                    M 566 430 L 596 508 L 588 602"/>
        </path>
        <path fill="none" stroke="#D97A2C" stroke-width="29" stroke-linecap="round" stroke-linejoin="round" d="M 566 430 L 596 508 L 588 602">
          <animate attributeName="d" dur="0.82s" repeatCount="indefinite"
            values="M 566 430 L 596 508 L 588 602;
                    M 566 430 L 616 497 L 548 562;
                    M 566 430 L 648 450 L 588 522;
                    M 566 430 L 640 469 L 628 562;
                    M 566 430 L 596 508 L 588 602"/>
        </path>
      </g>

      <!-- ================= BICYCLE ================= -->
      <!-- wheels -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 392 548" to="360 392 548" dur="0.82s" repeatCount="indefinite"/>
        <circle cx="392" cy="548" r="80" fill="#20303A"/>
        <circle cx="392" cy="548" r="60" fill="#F7E6C8"/>
        <path d="M 392 492 L 392 604 M 336 548 L 448 548 M 352 508 L 432 588 M 352 588 L 432 508"
              stroke="#B49B72" stroke-width="5" stroke-linecap="round"/>
        <circle cx="392" cy="548" r="60" fill="none" stroke="#20303A" stroke-width="6"/>
        <circle cx="392" cy="548" r="13" fill="#20303A"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 822 548" to="360 822 548" dur="0.82s" repeatCount="indefinite"/>
        <circle cx="822" cy="548" r="80" fill="#20303A"/>
        <circle cx="822" cy="548" r="60" fill="#F7E6C8"/>
        <path d="M 822 492 L 822 604 M 766 548 L 878 548 M 782 508 L 862 588 M 782 588 L 862 508"
              stroke="#B49B72" stroke-width="5" stroke-linecap="round"/>
        <circle cx="822" cy="548" r="60" fill="none" stroke="#20303A" stroke-width="6"/>
        <circle cx="822" cy="548" r="13" fill="#20303A"/>
      </g>

      <!-- chain -->
      <path d="M 392 530 L 588 522 M 392 566 L 588 602" stroke="#20303A" stroke-width="6" opacity=".85" fill="none"/>
      <circle cx="392" cy="548" r="18" fill="#F7E6C8" stroke="#20303A" stroke-width="5"/>
      <circle cx="588" cy="562" r="40" fill="#F7E6C8" stroke="#20303A" stroke-width="6"/>
      <circle cx="588" cy="562" r="15" fill="#F5C243" stroke="#20303A" stroke-width="5"/>

      <!-- frame -->
      <use href="#frameShape" stroke="#20303A" stroke-width="17"/>
      <use href="#frameShape" stroke="#F5C243" stroke-width="10"/>

      <!-- saddle -->
      <path d="M 466 392 C 474 374, 508 366, 544 372 C 566 376, 570 388, 554 396 C 532 408, 482 408, 466 392 Z"
            fill="#2E4450" stroke="#20303A" stroke-width="6" stroke-linejoin="round"/>

      <!-- handlebar -->
      <use href="#barShape" stroke="#20303A" stroke-width="18"/>
      <use href="#barShape" stroke="#F5C243" stroke-width="10"/>
      <path d="M 836 344 L 858 354" stroke="#20303A" stroke-width="22" stroke-linecap="round"/>

      <!-- crank + pedals -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 588 562" to="360 588 562" dur="0.82s" repeatCount="indefinite"/>
        <path d="M 588 562 L 588 522 M 588 562 L 588 602" stroke="#20303A" stroke-width="17" stroke-linecap="round" fill="none"/>
        <path d="M 588 562 L 588 522 M 588 562 L 588 602" stroke="#F5C243" stroke-width="9" stroke-linecap="round" fill="none"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 588 522" to="-360 588 522" dur="0.82s" repeatCount="indefinite"/>
          <rect x="562" y="513" width="52" height="18" rx="9" fill="#20303A"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 588 602" to="-360 588 602" dur="0.82s" repeatCount="indefinite"/>
          <rect x="562" y="593" width="52" height="18" rx="9" fill="#20303A"/>
        </g>
      </g>

      <!-- ================= PELICAN ================= -->
      <g class="bob">

        <!-- near leg -->
        <path fill="none" stroke="#20303A" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" d="M 566 430 L 648 450 L 588 522">
          <animate attributeName="d" dur="0.82s" repeatCount="indefinite"
            values="M 566 430 L 648 450 L 588 522;
                    M 566 430 L 640 469 L 628 562;
                    M 566 430 L 596 508 L 588 602;
                    M 566 430 L 616 497 L 548 562;
                    M 566 430 L 648 450 L 588 522"/>
        </path>
        <path fill="none" stroke="#F2913D" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" d="M 566 430 L 648 450 L 588 522">
          <animate attributeName="d" dur="0.82s" repeatCount="indefinite"
            values="M 566 430 L 648 450 L 588 522;
                    M 566 430 L 640 469 L 628 562;
                    M 566 430 L 596 508 L 588 602;
                    M 566 430 L 616 497 L 548 562;
                    M 566 430 L 648 450 L 588 522"/>
        </path>

        <!-- tail -->
        <path d="M 462 340 C 428 326, 398 336, 382 356 C 402 372, 436 372, 462 360 Z"
              fill="#F0DCBE" stroke="#20303A" stroke-width="6" stroke-linejoin="round"/>

        <!-- body -->
        <path d="M 452 372 C 448 322, 486 282, 552 276 C 616 270, 668 292, 692 330 C 712 362, 700 404, 656 418 C 606 434, 528 424, 486 402 C 466 392, 452 388, 452 372 Z"
              fill="#FFF7EA" stroke="#20303A" stroke-width="7" stroke-linejoin="round"/>

        <!-- wing -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-3 636 300; 3 636 300; -3 636 300" dur="1.1s" repeatCount="indefinite"/>
          <path d="M 636 300 C 612 288, 566 288, 534 306 C 502 324, 486 352, 496 372 C 508 392, 552 396, 592 384 C 630 372, 652 340, 636 300 Z"
                fill="#F0DCBE" stroke="#20303A" stroke-width="6" stroke-linejoin="round"/>
          <path d="M 522 336 C 552 326, 592 330, 618 350" fill="none" stroke="#D6BC96" stroke-width="5" stroke-linecap="round"/>
          <path d="M 524 358 C 552 350, 588 352, 610 366" fill="none" stroke="#D6BC96" stroke-width="5" stroke-linecap="round"/>
        </g>

        <!-- neck -->
        <path d="M 636 306 C 672 262, 700 232, 750 208" fill="none" stroke="#20303A" stroke-width="76" stroke-linecap="round"/>
        <path d="M 636 306 C 672 262, 700 232, 750 208" fill="none" stroke="#FFF7EA" stroke-width="62" stroke-linecap="round"/>

        <!-- scarf -->
        <path d="M 684 232 L 728 276" stroke="#D9482F" stroke-width="46" stroke-linecap="round" fill="none"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-7 684 232; 7 684 232; -7 684 232" dur="0.9s" repeatCount="indefinite"/>
          <path d="M 684 232 L 612 206" stroke="#D9482F" stroke-width="34" stroke-linecap="round" fill="none"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="8 612 206; -8 612 206; 8 612 206" dur="0.9s" repeatCount="indefinite" begin="-0.12s"/>
            <path d="M 612 206 L 536 222" stroke="#D9482F" stroke-width="27" stroke-linecap="round" fill="none"/>
            <g>
              <animateTransform attributeName="transform" type="rotate" values="-9 536 222; 9 536 222; -9 536 222" dur="0.9s" repeatCount="indefinite" begin="-0.24s"/>
              <path d="M 536 222 L 468 192" stroke="#D9482F" stroke-width="20" stroke-linecap="round" fill="none"/>
              <g>
                <animateTransform attributeName="transform" type="rotate" values="10 468 192; -10 468 192; 10 468 192" dur="0.9s" repeatCount="indefinite" begin="-0.36s"/>
                <path d="M 468 192 L 410 216" stroke="#D9482F" stroke-width="13" stroke-linecap="round" fill="none"/>
              </g>
            </g>
          </g>
        </g>

        <!-- head -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="2 750 208; -2.5 750 208; 2 750 208" dur="1.6s" repeatCount="indefinite"/>
          <circle cx="786" cy="186" r="52" fill="#FFF7EA" stroke="#20303A" stroke-width="7"/>

          <!-- crest -->
          <path d="M 752 146 L 734 116 L 764 138 Z" fill="#F0DCBE" stroke="#20303A" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 772 136 L 762 104 L 788 130 Z" fill="#F0DCBE" stroke="#20303A" stroke-width="5" stroke-linejoin="round"/>

          <!-- pouch + bill -->
          <path d="M 812 194 C 866 212, 952 214, 1010 202 C 1004 250, 956 278, 900 274 C 852 270, 818 236, 812 194 Z"
                fill="#E8763A" stroke="#20303A" stroke-width="6" stroke-linejoin="round"/>
          <path d="M 806 152 C 872 148, 952 166, 1016 192 C 1022 196, 1020 204, 1012 206 C 948 214, 866 208, 810 196 Z"
                fill="#F2913D" stroke="#20303A" stroke-width="6" stroke-linejoin="round"/>
          <path d="M 828 178 C 890 176, 954 190, 1002 202" fill="none" stroke="#D97A2C" stroke-width="5" stroke-linecap="round" opacity=".7"/>

          <!-- eye -->
          <circle cx="802" cy="163" r="11" fill="#20303A"/>
          <circle cx="806" cy="159" r="4" fill="#FFF7EA"/>
        </g>

        <!-- wing-arm to the handlebar -->
        <path d="M 650 318 C 682 322, 710 328, 728 332" fill="none" stroke="#20303A" stroke-width="46" stroke-linecap="round"/>
        <path d="M 650 318 C 682 322, 710 328, 728 332" fill="none" stroke="#FFF7EA" stroke-width="32" stroke-linecap="round"/>
        <circle cx="732" cy="331" r="19" fill="#FFF7EA" stroke="#20303A" stroke-width="6"/>
        <path d="M 726 322 L 738 328 M 724 334 L 738 336" stroke="#D6BC96" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- ================= FOREGROUND ================= -->
      <g class="tufts" fill="#27796A">
        <use href="#tuft" transform="translate(90 790) scale(1.35)"/>
        <use href="#tuft" transform="translate(330 772) scale(.9)"/>
        <use href="#tuft" transform="translate(560 796) scale(1.6)"/>
        <use href="#tuft" transform="translate(830 776) scale(1)"/>
        <use href="#tuft" transform="translate(1080 792) scale(1.3)"/>
        <use href="#tuft" transform="translate(1290 790) scale(1.35)"/>
        <use href="#tuft" transform="translate(1530 772) scale(.9)"/>
        <use href="#tuft" transform="translate(1760 796) scale(1.6)"/>
        <use href="#tuft" transform="translate(2030 776) scale(1)"/>
        <use href="#tuft" transform="translate(2280 792) scale(1.3)"/>
      </g>

      <!-- print grain + keyline -->
      <rect x="0" y="0" width="1200" height="800" filter="url(#grain)" opacity="0.12" style="mix-blend-mode:multiply"/>
      <rect x="10" y="10" width="1180" height="780" fill="none" stroke="#20303A" stroke-width="5" opacity=".9"/>
    </svg>
  </figure>

  <figcaption>
    <span><b>The Pelican Cyclist</b> &middot; looping vector animation</span>
    <span>Wheels, pedals, scarf and shoreline &mdash; all drawn in SVG.</span>
  </figcaption>
</main>

<script>
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('svg.art').forEach(function (s) {
      if (s.pauseAnimations) { s.pauseAnimations(); }
    });
  }
</script>

</body>
</html>
